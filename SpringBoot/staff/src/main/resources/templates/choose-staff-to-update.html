<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Update Staff</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand font-weight-bold" th:href="@{/}"
          >Staff Management</a
        >
        <div class="ml-auto">
          <a class="btn btn-outline-light btn-sm" th:href="@{/staff/update}"
            >Back</a
          >
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Update Staff</h1>
          <p class="text-muted mb-0">Choose a staff member to edit.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/staff/signup}">Add Staff</a>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
              <thead class="thead-dark">
                <tr>
                  <th>Staff Id</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Salary</th>
                  <th>Update</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${staffs.empty}">
                  <td colspan="5" class="text-center text-muted py-4">
                    No staff members found.
                  </td>
                </tr>
                <tr th:each="staff : ${staffs}">
                  <td th:text="${staff.id}"></td>
                  <td th:text="${staff.firstName}"></td>
                  <td th:text="${staff.lastName}"></td>
                  <td th:text="${staff.salary}"></td>
                  <td>
                    <a
                      th:href="@{/staff/edit/{id}(id=${staff.id})}"
                      class="btn btn-success btn-sm"
                    >
                      <i class="fas fa-user-edit mr-1"></i> Edit
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
