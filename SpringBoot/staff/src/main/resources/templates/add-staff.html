<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Add Staff</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand font-weight-bold" th:href="@{/}"
          >Staff Management</a
        >
        <div class="ml-auto">
          <a class="btn btn-outline-light btn-sm" th:href="@{/staff/list}"
            >Back to list</a
          >
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <h1 class="h3 mb-4">Add Staff</h1>
              <form
                th:action="@{/staff/add}"
                th:object="${staff}"
                method="post"
              >
                <div class="form-group">
                  <label for="firstName">First name</label>
                  <input
                    class="form-control"
                    id="firstName"
                    type="text"
                    th:field="*{firstName}"
                  />
                </div>
                <div class="form-group">
                  <label for="lastName">Last name</label>
                  <input
                    class="form-control"
                    id="lastName"
                    type="text"
                    th:field="*{lastName}"
                  />
                </div>
                <div class="form-group">
                  <label for="salary">Salary</label>
                  <input
                    class="form-control"
                    id="salary"
                    type="number"
                    th:field="*{salary}"
                  />
                </div>

                <div class="form-group">
                  <label for="department">Department</label>
                  <select
                    class="form-control"
                    id="department"
                    th:field="*{department}"
                  >
                    <option
                      th:each="dept : ${departments}"
                      th:value="${dept.deptId}"
                    >
                      [[${dept.deptName}]]
                    </option>
                  </select>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <a class="btn btn-link px-0" th:href="@{/staff/list}"
                    >Cancel</a
                  >
                  <button class="btn btn-primary" type="submit">
                    Add Staff
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
