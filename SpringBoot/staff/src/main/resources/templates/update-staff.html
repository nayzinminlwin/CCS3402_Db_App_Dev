<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Update Staff</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand font-weight-bold" th:href="@{/}"
          >Staff Management</a
        >
        <div class="ml-auto">
          <a class="btn btn-outline-light btn-sm" th:href="@{/staff/update}"
            >Back</a
          >
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <div
                class="d-flex justify-content-between align-items-center mb-4"
              >
                <div>
                  <h1 class="h3 mb-1">Update Staff</h1>
                  <p class="text-muted mb-0">Edit the selected staff member.</p>
                </div>
              </div>

              <form
                action="#"
                th:action="@{/staff/update/{id}(id=${staff.id})}"
                th:object="${staff}"
                th:method="post"
              >
                <div class="form-row">
                  <div class="form-group col-md-6">
                    <label for="staffId">Staff Id</label>
                    <input
                      type="text"
                      th:field="*{id}"
                      class="form-control"
                      id="staffId"
                      readonly
                    />
                    <span
                      th:if="${#fields.hasErrors('id')}"
                      th:errors="*{id}"
                      class="text-danger"
                    ></span>
                  </div>
                  <div class="form-group col-md-6">
                    <label for="salary">Salary</label>
                    <input
                      type="text"
                      th:field="*{salary}"
                      class="form-control"
                      id="salary"
                    />
                    <span
                      th:if="${#fields.hasErrors('salary')}"
                      th:errors="*{salary}"
                      class="text-danger"
                    ></span>
                  </div>
                  <div class="form-group col-md-6">
                    <label for="firstName">First Name</label>
                    <input
                      type="text"
                      th:field="*{firstName}"
                      class="form-control"
                      id="firstName"
                    />
                    <span
                      th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}"
                      class="text-danger"
                    ></span>
                  </div>
                  <div class="form-group col-md-6">
                    <label for="lastName">Last Name</label>
                    <input
                      type="text"
                      th:field="*{lastName}"
                      class="form-control"
                      id="lastName"
                    />
                    <span
                      th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}"
                      class="text-danger"
                    ></span>
                  </div>
                </div>

                <div class="form-group">
                  <label for="department">Department</label>
                  <select
                    class="form-control"
                    id="department"
                    th:field="*{department}"
                  >
                    <option
                      th:each="dept : ${departments}"
                      th:value="${dept.deptId}"
                      th:text="${dept.deptName}"
                      th:selected="${dept.deptId == staff.department?.deptId}"
                    ></option>
                  </select>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mt-3"
                >
                  <a class="btn btn-link px-0" th:href="@{/staff/update}"
                    >Cancel</a
                  >
                  <button type="submit" class="btn btn-success">
                    Update Staff
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
