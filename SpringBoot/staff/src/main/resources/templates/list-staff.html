<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Staff List</title>
  </head>
  <body>
    <h1>Staff List</h1>
    <table border="1">
      <thead>
        <tr>
          <th>Staff ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Salary</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${staffs.empty}">
          <td colspan="4">No staff members found.</td>
        </tr>
        <tr th:each="staff : ${staffs}">
          <td><span th:text="${staff.id}"></span></td>
          <td><span th:text="${staff.firstName}"></span></td>
          <td><span th:text="${staff.lastName}"></span></td>
          <td><span th:text="${staff.salary}"></span></td>
        </tr>
      </tbody>
    </table>
    <a href="/" th:href="@{/}">Back to Main Menu</a>
  </body>
</html>
