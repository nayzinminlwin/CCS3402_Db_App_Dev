<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Staff Management</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand font-weight-bold" href="#" th:href="@{/}"
          >Staff Management</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/staff/list}">Staff List</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/staff/signup}">New Staff</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/staff/update}">Update Staff</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/staff/delete}">Delete Staff</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-5 text-center">
              <h1 class="display-4 mb-3">Staff Management</h1>
              <p class="lead text-muted mb-4">
                Welcome to the Staff Management Application!
              </p>
              <div
                class="d-flex flex-column flex-sm-row justify-content-center"
              >
                <a
                  class="btn btn-primary btn-lg mr-sm-2 mb-2 mb-sm-0"
                  th:href="@{/staff/list}"
                  >View Staff</a
                >
                <a
                  class="btn btn-outline-primary btn-lg mr-sm-2 mb-2 mb-sm-0"
                  th:href="@{/staff/signup}"
                  >Add Staff</a
                >
                <a
                  class="btn btn-outline-secondary btn-lg mr-sm-2 mb-2 mb-sm-0"
                  th:href="@{/staff/update}"
                  >Update Staff</a
                >
                <a
                  class="btn btn-outline-danger btn-lg"
                  th:href="@{/staff/delete}"
                  >Delete Staff</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
