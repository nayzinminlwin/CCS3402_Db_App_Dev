<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Input Form</title>
    <!-- Bootstrap CSS from the local node_modules folder -->
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar bg-light border-top border-bottom fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">User Input Form</a>
      </div>
    </nav>

    <div class="container mt-4">
      <h4 class="mb-4">Please fill out the form below:</h4>
      <form>
        <!-- name text input -->
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Enter your name"
          />
        </div>

        <!-- education dropdown select -->
        <div class="mb-3">
          <label for="education" class="form-label">Education Level</label>
          <select class="form-select" id="education">
            <option selected disabled>Select your education level</option>
            <option value="highschool">High School</option>
            <option value="bachelor">Bachelor's Degree</option>
            <option value="master">Master's Degree</option>
            <option value="phd">PhD</option>
          </select>
        </div>

        <!-- email text input -->
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
          />
        </div>

        <!-- message textarea input -->
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea
            class="form-control"
            id="message"
            rows="4"
            placeholder="Enter your message"
          ></textarea>
        </div>

        <!-- buttons -->
        <div class="mb-3">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="reset" class="btn btn-danger">Clear</button>
        </div>
      </form>
    </div>
  </body>
</html>
